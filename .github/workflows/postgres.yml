name: Verify PostgreSQL
on: [push, pull_request]
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start a fresh database
        run: |
          echo "LEDGER_DB_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: docker compose up -d --wait db
      - name: Apply migration, insert a job and verify replay preserves it
        shell: bash
        run: |
          psql_db() { docker compose exec -T db psql -X -v ON_ERROR_STOP=1 -U ledger -d ledger "$@"; }
          psql_db < db/migrations/001_jobs.sql
          psql_db -c "INSERT INTO jobs (request_id,input_hash,seed,trials) VALUES ('smoke',decode(repeat('ab',32),'hex'),42,1000)"
          psql_db < db/migrations/001_jobs.sql
          test "$(psql_db -Atc 'SELECT version FROM schema_migrations')" = 1
          test "$(psql_db -Atc "SELECT trials FROM jobs WHERE request_id='smoke'")" = 1000
          psql_db <<'SQL'
          DO $$
          BEGIN
            BEGIN
              UPDATE jobs SET trials = 0 WHERE request_id = 'smoke';
              RAISE EXCEPTION 'invalid trial count accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              INSERT INTO jobs (request_id,input_hash,seed,trials)
                SELECT request_id,input_hash,seed,trials FROM jobs;
              RAISE EXCEPTION 'duplicate request accepted';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
          END $$;
          SQL
      - name: Migrate existing jobs and provision isolated caller credentials
        run: |
          psql_db() { docker compose exec -T db psql -X -v ON_ERROR_STOP=1 -U ledger -d ledger "$@"; }
          psql_db < db/migrations/002_callers.sql
          psql_db < db/migrations/002_callers.sql
          test "$(psql_db -Atc "SELECT count(*) FROM jobs WHERE request_id='smoke' AND submitted_by IS NULL")" = 1
          psql_db < db/migrations/003_claim.sql
          psql_db < db/migrations/003_claim.sql
          psql_db < db/migrations/004_reclaim.sql
          psql_db < db/migrations/004_reclaim.sql
          psql_db < db/tests/reclaim.sql
          psql_db <<'SQL'
          BEGIN;
          DO $$
          DECLARE claimed record;
          BEGIN
            SELECT * INTO STRICT claimed FROM public.claim_job();
            IF claimed.seed <> 42 OR claimed.trials <> 1000 OR claimed.token IS NULL
                OR claimed.expires_at <= clock_timestamp() THEN
              RAISE EXCEPTION 'invalid lease for migrated job';
            END IF;
            IF EXISTS (SELECT FROM public.claim_job()) THEN
              RAISE EXCEPTION 'same job claimed twice';
            END IF;
          END $$;
          ROLLBACK;
          SQL
          test "$(psql_db -Atc 'SELECT count(*) FROM jobs WHERE lease_token IS NULL')" = 1
          for login in researcher viewer; do
            password=$(openssl rand -hex 32)
            echo "::add-mask::$password"
            docker compose exec -T -e CALLER_PASSWORD="$password" db psql -X -v ON_ERROR_STOP=1 -v login="$login" -U ledger -d ledger <<'SQL'
          \getenv password CALLER_PASSWORD
          CREATE ROLE :"login" LOGIN PASSWORD :'password';
          GRANT EXECUTE ON FUNCTION public.submit_risk(text,bigint,integer) TO :"login";
          INSERT INTO public.callers(login,role) VALUES (:'login', :'login');
          SQL
            echo "${login}_url=postgres://$login:$password@127.0.0.1:5432/ledger?sslmode=disable" >> "$GITHUB_ENV"
          done
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Race two worker logins for one queued job
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/claim-ledger" ./cmd/ledger
          for worker in worker_a worker_b; do
            password=$(openssl rand -hex 32)
            echo "::add-mask::$password"
            docker compose exec -T -e WORKER_PASSWORD="$password" db psql -X -v ON_ERROR_STOP=1 -v login="$worker" -U ledger -d ledger <<'SQL'
          \getenv password WORKER_PASSWORD
          CREATE ROLE :"login" LOGIN PASSWORD :'password';
          GRANT EXECUTE ON FUNCTION public.claim_job() TO :"login";
          SQL
            printf -v "${worker}_url" 'postgres://%s:%s@127.0.0.1:5432/ledger?sslmode=disable' "$worker" "$password"
          done
          rc=0
          LEDGER_DATABASE_URL="$researcher_url" "$RUNNER_TEMP/claim-ledger" claim >/dev/null || rc=$?
          test "$rc" = 4
          pids=()
          for i in {1..16}; do
            if (( i % 2 )); then worker=worker_a; else worker=worker_b; fi
            url_var="${worker}_url"
            LEDGER_DATABASE_URL="${!url_var}" "$RUNNER_TEMP/claim-ledger" claim > "$RUNNER_TEMP/claim-$worker-$i.json" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          files=("$RUNNER_TEMP"/claim-worker*.json)
          jq -se 'length == 16 and (map(select(. != null)) | length == 1)' "${files[@]}" >/dev/null
          winner=$(jq -r 'select(. != null) | input_filename' "${files[@]}")
          owner=$(basename "$winner" | cut -d- -f2)
          expected=$(docker compose exec -T db psql -XAt -U ledger -d ledger -c "SELECT id || '|' || lease_owner || '|' || lease_token FROM jobs WHERE request_id='smoke'")
          test "$expected" = "$(jq -r --arg owner "$owner" '[.job_id,$owner,.lease_token] | join("|")' "$winner")"
          jq -e '.seed == 42 and .trials == 1000 and (.expires_at | type == "string")' "$winner" >/dev/null
      - name: Retry concurrent CLI submissions and reject conflicting inputs
        shell: bash
        run: |
          export LEDGER_DATABASE_URL="$researcher_url"
          go build -o "$RUNNER_TEMP/ledger" ./cmd/ledger
          cd "$RUNNER_TEMP"
          pids=()
          for i in {1..16}; do
            ./ledger submit -request-id concurrent -seed -12 -trials 500 > "result-$i.json" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          jq -e '.job_id > 0' result-1.json
          for i in {2..16}; do cmp result-1.json "result-$i.json"; done
          for args in '-seed -11 -trials 500' '-seed -12 -trials 501'; do
            rc=0
            ./ledger submit -request-id concurrent $args || rc=$?
            test "$rc" = 3
          done
          ./ledger submit -request-id concurrent -seed -12 -trials 500 | cmp result-1.json -
          ./ledger submit -request-id independent -seed -12 -trials 500 > other.json
          test "$(jq .job_id other.json)" != "$(jq .job_id result-1.json)"
          cd "$GITHUB_WORKSPACE"
          test "$(docker compose exec -T db psql -XAt -U ledger -d ledger -c "SELECT count(*) FROM jobs WHERE request_id='concurrent'")" = 1
      - name: Verify authorization decisions and attribution
        run: |
          psql_db() { docker compose exec -T db psql -X -v ON_ERROR_STOP=1 -U ledger -d ledger "$@"; }
          for key in concurrent denied-only; do
            rc=0
            LEDGER_DATABASE_URL="$viewer_url" "$RUNNER_TEMP/ledger" submit -request-id "$key" || rc=$?
            test "$rc" = 4
          done
          psql_db -c "DELETE FROM callers WHERE login='viewer'"
          rc=0
          LEDGER_DATABASE_URL="$viewer_url" "$RUNNER_TEMP/ledger" submit -request-id unmapped || rc=$?
          test "$rc" = 4
          test "$(psql_db -Atc "SELECT count(*) FROM submission_decisions WHERE login='viewer' AND outcome='denied' AND role='viewer'")" = 2
          test "$(psql_db -Atc "SELECT count(*) FROM submission_decisions WHERE login='viewer' AND outcome='denied' AND role IS NULL")" = 1
          test "$(psql_db -Atc "SELECT count(*) FROM jobs WHERE request_id IN ('denied-only','unmapped')")" = 0
          test "$(psql_db -Atc "SELECT count(*) FROM submission_decisions d JOIN jobs j ON d.job_id=j.id WHERE d.login=j.submitted_by AND d.role='researcher' AND d.outcome='accepted' AND j.request_id='concurrent'")" = 17
          test "$(psql_db -Atc "SELECT count(*) FROM submission_decisions WHERE login='researcher' AND outcome='conflict'")" = 2
          test "$(psql_db -Atc "SELECT has_table_privilege('viewer','public.jobs','INSERT') OR has_table_privilege('researcher','public.callers','UPDATE')")" = f
      - name: Verify caller isolation and rollback on audit failure
        run: |
          psql_db() { docker compose exec -T db psql -X -v ON_ERROR_STOP=1 -U ledger -d ledger "$@"; }
          psql_db -c "INSERT INTO callers(login,role) VALUES('viewer','researcher')"
          rc=0
          LEDGER_DATABASE_URL="$viewer_url" "$RUNNER_TEMP/ledger" submit -request-id concurrent -seed -12 -trials 500 || rc=$?
          test "$rc" = 3
          test "$(psql_db -Atc "SELECT count(*) FROM submission_decisions WHERE login='viewer' AND outcome='conflict' AND job_id IS NULL")" = 1
          psql_db -c "ALTER TABLE submission_decisions ADD CHECK (request_id <> 'audit-failure')"
          rc=0
          LEDGER_DATABASE_URL="$researcher_url" "$RUNNER_TEMP/ledger" submit -request-id audit-failure || rc=$?
          test "$rc" = 1
          test "$(psql_db -Atc "SELECT count(*) FROM jobs WHERE request_id='audit-failure'")" = 0
      - if: always()
        run: docker compose down -v
